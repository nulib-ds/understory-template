        ) return redirect(\"/\");\n  match = uri.match(/^\\/collection\\/([^\\/]+)\\\
        /work\\/([^\\/]+)\\/?$/);\n  if (match) return redirect(\"/collection/work?slug=\"\
        \ + match[1] + \"&id=\" + match[2]);\n  match = uri.match(/^\\/collection\\\
        /([^\\/]+)\\/search\\/?$/);\n  if (match && match[1] !== \"work\") return\
        \ redirect(\"/collection/search?slug=\" + match[1]);\n  match = uri.match(/^\\\
        /collection\\/([^\\/]+)\\/?$/);\n  if (match && match[1] !== \"work\" && match[1]\
        \ !== \"search\") return redirect(\"/collection?slug=\" + match[1]);\n  if\
        \ (uri.length > 1 && uri.charAt(uri.length - 1) === \"/\") uri = uri.slice(0,\
        \ -1);\n  if (uri !== \"/\" && !/\\.[A-Za-z0-9]+$/.test(uri)) request.uri\
        \ = uri + \".html\";\n  return request;\n}\n"
    Metadata:
      SamResourceId: AdminRouterFunction
  AdminDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment:
          Fn::Sub: ${AWS::StackName} admin UI
        HttpVersion: http2and3
        IPV6Enabled: true
        DefaultRootObject: index.html
        Aliases:
          Fn::If:
          - HasCustomDomain
          - - Fn::Sub: admin-${ProjectName}.${BaseDomainName}
          - Ref: AWS::NoValue
        ViewerCertificate:
          Fn::If:
          - HasCustomDomain
          - AcmCertificateArn:
              Ref: CertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true
        Origins:
        - Id: ui-bucket
          DomainName:
            Fn::GetAtt:
            - UiBucket
            - RegionalDomainName
          OriginAccessControlId:
            Fn::GetAtt:
            - AdminOriginAccessControl
            - Id
          S3OriginConfig:
            OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: ui-bucket
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
          - GET
          - HEAD
          CachedMethods:
          - GET
          - HEAD
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03
          FunctionAssociations:
          - EventType: viewer-request
            FunctionARN:
              Fn::GetAtt:
              - AdminRouterFunction
              - FunctionMetadata.FunctionARN
        CustomErrorResponses:
        - ErrorCode: 403
          ResponseCode: 404
          ResponsePagePath: /404.html
          ErrorCachingMinTTL: 10
        - ErrorCode: 404
          ResponseCode: 404
          ResponsePagePath: /404.html
          ErrorCachingMinTTL: 10
    Metadata:
      SamResourceId: AdminDistribution
  AdminDnsRecord:
    Type: AWS::Route53::RecordSet
    Condition: ManageDns
    Properties:
      HostedZoneId:
        Ref: HostedZoneId
      Name:
        Fn::Sub: admin-${ProjectName}.${BaseDomainName}
      Type: A
      AliasTarget:
        DNSName:
          Fn::GetAtt:
          - AdminDistribution
          - DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false
    Metadata:
      SamResourceId: AdminDnsRecord
  UiLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName:
        Fn::Sub: ${AWS::StackName}-ui
      Description: Understory admin UI (static export)
      ContentUri: s3://understory-releases-us-east-1/v1.0.0/96880fad8f20d83c1036f5debcb97d47
      RetentionPolicy: Delete
    Metadata:
      SamResourceId: UiLayer
  BrandingLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName:
        Fn::Sub: ${AWS::StackName}-branding
      Description: This instance's branding/ folder
      ContentUri: branding/
      RetentionPolicy: Delete
    Metadata:
      SamResourceId: BrandingLayer
  InstanceSetupFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
        - aws/lambdas/instance-setup/index.js
        External:
        - '@aws-sdk/*'
        Minify: false
        Sourcemap: false
        Target: node22
      SamResourceId: InstanceSetupFunction
    Properties:
      FunctionName:
        Fn::Sub: ${AWS::StackName}-instance-setup
      CodeUri: s3://understory-releases-us-east-1/v1.0.0/7cab786f2dcb58d9229b2b0486585c72
      Handler: index.handler
      Timeout: 600
      Layers:
      - Ref: UiLayer
      - Ref: BrandingLayer
      Policies:
      - Statement:
        - Effect: Allow
          Action: s3:ListBucket
          Resource:
            Fn::GetAtt:
            - UiBucket
            - Arn
        - Effect: Allow
          Action:
          - s3:PutObject
          - s3:DeleteObject
          Resource:
            Fn::Sub: ${UiBucket.Arn}/*
        - Effect: Allow
          Action: cloudfront:CreateInvalidation
          Resource:
            Fn::Sub: arn:aws:cloudfront::${AWS::AccountId}:distribution/${AdminDistribution}
        - Effect: Allow
          Action:
          - cognito-idp:AdminGetUser
          - cognito-idp:AdminCreateUser
          - cognito-idp:AdminAddUserToGroup
          Resource:
            Fn::GetAtt:
            - CognitoUserPool
            - Arn
  InstanceSetup:
    Type: Custom::InstanceSetup
    DependsOn:
    - UiBucketPolicy
    - AdminGroup
    Properties:
      ServiceToken:
        Fn::GetAtt:
        - InstanceSetupFunction
        - Arn
      ServiceTimeout: 900
      UiBucket:
        Ref: UiBucket
      DistributionId:
        Ref: AdminDistribution
      UserPoolId:
        Ref: CognitoUserPool
      AdminEmail:
        Ref: AdminEmail
      UiLayer:
        Ref: UiLayer
      BrandingLayer:
        Ref: BrandingLayer
      Config:
        version:
          Fn::FindInMap:
          - Release
          - Understory
          - Version
        region:
          Ref: AWS::Region
        apiUrl:
          Fn::Sub: https://${ManifestHttpApi}.execute-api.${AWS::Region}.amazonaws.com
        documentsUrl:
          Fn::If:
          - HasCustomDomain
          - Fn::Sub: https://iiif-${ProjectName}.${BaseDomainName}
          - Fn::Sub: https://${IIIFDistribution.DomainName}
        imageApiUrl:
          Fn::If:
          - HasCustomDomain
          - Fn::Sub: https://images-${ProjectName}.${BaseDomainName}/iiif/3
          - Fn::Sub: https://${ImagesDistribution.DomainName}/iiif/3
        iiifBucket:
          Ref: IIIFBucket
        sourceBucket:
          Ref: SourceBucket
        userPoolId:
          Ref: CognitoUserPool
        userPoolClientId:
          Ref: CognitoUserPoolClient
        identityPoolId:
          Ref: CognitoIdentityPool
        institutionName:
          Ref: InstitutionName
        accentColor:
          Ref: AccentColor
    Metadata:
      SamResourceId: InstanceSetup
  IiifServer:
    Type: AWS::Serverless::Application
    Properties:
      Location:
        ApplicationId: arn:aws:serverlessrepo:us-east-1:625046682746:applications/serverless-iiif
        SemanticVersion: 7.0.1
      Parameters:
        SourceBucket:
          Ref: IIIFBucket
        ForceHost:
          Fn::If:
          - HasCustomDomain
          - Fn::Sub: images-${ProjectName}.${BaseDomainName}
          - Ref: AWS::NoValue
        IiifLambdaTimeout: 30
    Metadata:
      SamResourceId: IiifServer
Outputs:
  SourceBucketName:
    Value:
      Fn::Sub: ${AWS::StackName}-source
  IIIFBucketName:
    Value:
      Fn::Sub: ${AWS::StackName}-iiif
  IIIFImageFunctionArn:
    Value:
      Fn::Sub: arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}-iiif-image
  IiifEndpoint:
    Description: The Image API's origin, behind ImagesEndpoint. Useful for debugging;
      not what anything should be pointed at.
    Value:
      Fn::Sub: https://${IiifServer.Outputs.FunctionDomain}/iiif/3
  IIIFEndpoint:
    Description: "Base URL for IIIF documents \u2014 the value baked into every manifest\
      \ id. This is IIIF_BASE_URL."
    Value:
      Fn::If:
      - HasCustomDomain
      - Fn::Sub: https://iiif-${ProjectName}.${BaseDomainName}
      - Fn::Sub: https://${IIIFDistribution.DomainName}
  ImagesEndpoint:
    Description: Base URL for the IIIF Image API.
    Value:
      Fn::If:
      - HasCustomDomain
      - Fn::Sub: https://images-${ProjectName}.${BaseDomainName}/iiif/3
      - Fn::Sub: https://${ImagesDistribution.DomainName}/iiif/3
  IIIFDistributionId:
    Description: Invalidated by the publish run.
    Value:
      Ref: IIIFDistribution
  AdminUrl:
    Description: The admin UI.
    Value:
      Fn::If:
      - HasCustomDomain
      - Fn::Sub: https://admin-${ProjectName}.${BaseDomainName}
      - Fn::Sub: https://${AdminDistribution.DomainName}
  AdminDistributionId:
    Value:
      Ref: AdminDistribution
  UnderstoryVersion:
    Description: The Understory release this stack runs. 0.0.0-dev when deployed from
      source.
    Value:
      Fn::FindInMap:
      - Release
      - Understory
      - Version
  ManifestApiUrl:
    Value:
      Fn::Sub: https://${ManifestHttpApi}.execute-api.${AWS::Region}.amazonaws.com
  PublicSearchUrl:
    Description: 'Where a consuming site sends a search: replace {slug} with the collection
      id and add ?q= (and optionally from, size). Served through IIIFDistribution
      only.'
    Value:
      Fn::If:
      - HasCustomDomain
      - Fn::Sub: https://iiif-${ProjectName}.${BaseDomainName}/search/{slug}
      - Fn::Sub: https://${IIIFDistribution.DomainName}/search/{slug}
  SearchEndpoint:
    Description: 'The search collection''s own endpoint. It answers only requests
      SigV4-signed by a role SearchDataAccessPolicy names, never a consuming site:
      that is PublicSearchUrl.'
    Value:
      Fn::GetAtt:
      - SearchCollection
      - CollectionEndpoint
  CognitoUserPoolId:
    Value:
      Ref: CognitoUserPool
  CognitoClientId:
    Value:
      Ref: CognitoUserPoolClient
  CognitoIdentityPoolId:
    Value:
      Ref: CognitoIdentityPool
