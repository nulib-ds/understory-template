  PublishStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name:
        Fn::Sub: ${AWS::StackName}-publish
      Type: STANDARD
      Policies:
      - LambdaInvokePolicy:
          FunctionName:
            Ref: PublishFunction
      Definition:
        Comment: Publish one collection's IIIF assets and stage its search index
        StartAt: Plan
        States:
          Plan:
            Type: Task
            Resource:
              Fn::GetAtt:
              - PublishFunction
              - Arn
            Parameters:
              task: plan
              slug.$: $.slug
              runId.$: $.runId
              requestedBy.$: $.requestedBy
            ResultPath: $.plan
            Catch:
            - ErrorEquals:
              - States.ALL
              ResultPath: $.error
              Next: RecordFailure
            Next: PublishWorks
          PublishWorks:
            Type: Map
            ItemsPath: $.plan.batches
            MaxConcurrency: 8
            Parameters:
              task: batch
              slug.$: $.slug
              runId.$: $.runId
              indexName.$: $.plan.indexName
              batchIndex.$: $$.Map.Item.Value
            Iterator:
              StartAt: PublishBatch
              States:
                PublishBatch:
                  Type: Task
                  Resource:
                    Fn::GetAtt:
                    - PublishFunction
                    - Arn
                  Retry:
                  - ErrorEquals:
                    - Lambda.TooManyRequestsException
                    - Lambda.ServiceException
                    - States.TaskFailed
                    IntervalSeconds: 2
                    MaxAttempts: 3
                    BackoffRate: 2
                  End: true
            ResultPath: null
            Catch:
            - ErrorEquals:
              - States.ALL
              ResultPath: $.error
              Next: RecordFailure
            Next: WriteCollection
          WriteCollection:
            Type: Task
            Resource:
              Fn::GetAtt:
              - PublishFunction
              - Arn
            Parameters:
              task: writeCollection
              slug.$: $.slug
              runId.$: $.runId
            ResultPath: $.result
            Catch:
            - ErrorEquals:
              - States.ALL
              ResultPath: $.error
              Next: RecordFailure
            Next: Invalidate
          Invalidate:
            Type: Task
            Resource:
              Fn::GetAtt:
              - PublishFunction
              - Arn
            Parameters:
              task: invalidate
              slug.$: $.slug
              runId.$: $.runId
            ResultPath: null
            Catch:
            - ErrorEquals:
              - States.ALL
              ResultPath: $.invalidateError
              Next: Finalize
            Next: Finalize
          Finalize:
            Type: Task
            Resource:
              Fn::GetAtt:
              - PublishFunction
              - Arn
            Parameters:
              task: finalize
              slug.$: $.slug
              runId.$: $.runId
              indexName.$: $.plan.indexName
              result.$: $.result
            Retry:
            - ErrorEquals:
              - States.ALL
              IntervalSeconds: 2
              MaxAttempts: 2
              BackoffRate: 2
            Catch:
            - ErrorEquals:
              - States.ALL
              ResultPath: $.error
              Next: RecordFailure
            End: true
          RecordFailure:
            Type: Task
            Resource:
              Fn::GetAtt:
              - PublishFunction
              - Arn
            Parameters:
              task: recordFailure
              slug.$: $.slug
              runId.$: $.runId
              error.$: $.error
            Next: Failed
          Failed:
            Type: Fail
            Error: PublishFailed
            Cause: The publish run did not complete; see the collection's status object
    Metadata:
      SamResourceId: PublishStateMachine
