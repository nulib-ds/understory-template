# Understory v1.0.0, packaged for us-east-1.
# Generated by scripts/release.py. Do not edit: an instance's deploy checks
# this file against understory.yml.sha256 from the release bucket. Replace
# it with scripts/upgrade <version> in the instance repo.
AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: 'Understory: admin backend for downstream IIIF sites'
Parameters:
  AdminEmail:
    Type: String
    Default: ''
    Description: Email of the first administrator. On the first deploy that sets it,
      this address is invited (Cognito emails a temporary password) and added to the
      admin group. Ignored while a user with this email exists, so changing it later
      invites one more admin and removes nobody.
  InstitutionName:
    Type: String
    Default: ''
    Description: Shown in the admin UI's top bar (unless branding/header.html replaces
      it) and its page title.
  AccentColor:
    Type: String
    Default: iris
    AllowedValues:
    - gray
    - gold
    - bronze
    - brown
    - yellow
    - amber
    - orange
    - tomato
    - red
    - ruby
    - crimson
    - pink
    - plum
    - purple
    - violet
    - iris
    - indigo
    - blue
    - cyan
    - teal
    - jade
    - green
    - grass
    - lime
    - mint
    - sky
    Description: The admin UI's accent colour, as a Radix Themes colour name. branding/theme.css
      can override it with a palette of its own.
  SearchMaxOcu:
    Type: Number
    Default: 2
    AllowedValues:
    - 2
    - 4
    - 8
    - 16
    Description: 'Ceiling on the search collection''s capacity, in OCUs, applied to
      indexing and to search separately. This is the spend cap: the collection never
      scales past it. It scales to zero when idle whatever this says. Serverless accepts
      2, 4, 8, 16 or multiples of 16.'
  SearchCollectionName:
    Type: String
    Default: ''
    AllowedPattern: ^([a-z][a-z0-9-]{2,26})?$
    Description: Name for this stack's OpenSearch collection, its group and its three
      policies (<name>-enc, -net, -data). Empty means the stack name, which then must
      be 27 characters or fewer; set this for a longer stack name. 3-27 lowercase
      letters, digits and hyphens, starting with a letter. Changing it on an existing
      stack replaces the collection, so set it only when creating one.
  SearchIndexPrefix:
    Type: String
    Default: ''
    Description: Prefix for this stack's OpenSearch index and alias names. Must be
      lowercase. Defaults to the stack name. Index names are built as <prefix>.<slug>._pub.<runId>,
      with <prefix>.<slug> as the alias a consuming site points at.
  ProjectName:
    Type: String
    Default: understory
    Description: Used only to build hostnames (iiif-<project>.<base>, images-<project>.<base>,
      admin-<project>.<base>). Must be lowercase. It ends up inside published document
      URLs, so do not change it on a stack that has published.
  BaseDomainName:
    Type: String
    Default: ''
    Description: 'e.g. library.example.edu. Leave blank to use the generated *.cloudfront.net
      names. Choose before publishing: every IIIF id embeds the host, so adding or
      changing a domain later changes every published URL.'
  CertificateArn:
    Type: String
    Default: ''
    Description: ACM certificate ARN in us-east-1 (CloudFront's region, whatever this
      stack's) covering *.<BaseDomainName>. One certificate serves all three distributions.
      Required whenever BaseDomainName is set; ignored otherwise.
  HostedZoneId:
    Type: String
    Default: ''
    Description: 'Route53 hosted zone for BaseDomainName. Optional: leave blank to
      set the domains up but manage the three DNS records elsewhere.'
Globals:
  Function:
    Runtime: nodejs22.x
    Architectures:
    - arm64
    Timeout: 300
    MemorySize: 1025
    Environment:
      Variables:
        SOURCE_BUCKET:
          Fn::Sub: ${AWS::StackName}-source
        IIIF_BUCKET:
          Fn::Sub: ${AWS::StackName}-iiif
        IIIF_BASE_URL:
          Fn::If:
          - HasCustomDomain
          - Fn::Sub: https://iiif-${ProjectName}.${BaseDomainName}
          - Fn::Sub: https://${IIIFDistribution.DomainName}
        IMAGE_API_BASE_URL:
          Fn::If:
          - HasCustomDomain
          - Fn::Sub: https://images-${ProjectName}.${BaseDomainName}/iiif/3
          - Fn::Sub: https://${ImagesDistribution.DomainName}/iiif/3
Conditions:
  SearchIndexPrefixProvided:
    Fn::Not:
    - Fn::Equals:
      - Ref: SearchIndexPrefix
      - ''
  SearchCollectionNameProvided:
    Fn::Not:
    - Fn::Equals:
      - Ref: SearchCollectionName
      - ''
  HasCustomDomain:
    Fn::And:
    - Fn::Not:
      - Fn::Equals:
        - Ref: BaseDomainName
        - ''
    - Fn::Not:
      - Fn::Equals:
        - Ref: CertificateArn
        - ''
  ManageDns:
    Fn::And:
    - Condition: HasCustomDomain
    - Fn::Not:
      - Fn::Equals:
        - Ref: HostedZoneId
        - ''
Mappings:
  Release:
    Understory:
      Version: 1.0.0
Resources:
  SourceBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    DependsOn:
    - IIIFImageFunctionS3Permission
    - AVTranscodeFunctionS3Permission
    Properties:
      BucketName:
        Fn::Sub: ${AWS::StackName}-source
      LifecycleConfiguration:
        Rules:
        - Id: AbortIncompleteMultipartUploads
          Status: Enabled
          AbortIncompleteMultipartUpload:
            DaysAfterInitiation: 3
      NotificationConfiguration:
        LambdaConfigurations:
        - Event: s3:ObjectCreated:*
          Filter:
            S3Key:
              Rules:
              - Name: prefix
                Value: image/
          Function:
            Fn::GetAtt:
            - IIIFImageFunction
            - Arn
        - Event: s3:ObjectCreated:*
          Filter:
            S3Key:
              Rules:
              - Name: prefix
                Value: av/
          Function:
            Fn::GetAtt:
            - AVTranscodeFunction
            - Arn
      CorsConfiguration:
        CorsRules:
        - AllowedHeaders:
          - '*'
          AllowedMethods:
          - GET
          - PUT
          - POST
          - DELETE
          - HEAD
          AllowedOrigins:
          - '*'
          ExposedHeaders:
          - ETag
    Metadata:
      SamResourceId: SourceBucket
  IIIFBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      BucketName:
        Fn::Sub: ${AWS::StackName}-iiif
      LifecycleConfiguration:
        Rules:
        - Id: AbortIncompleteMultipartUploads
          Status: Enabled
          AbortIncompleteMultipartUpload:
            DaysAfterInitiation: 3
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
        - AllowedHeaders:
          - '*'
          AllowedMethods:
          - GET
          AllowedOrigins:
          - '*'
    Metadata:
      SamResourceId: IIIFBucket
  IIIFBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket:
        Ref: IIIFBucket
      PolicyDocument:
        Statement:
        - Effect: Allow
          Principal:
            Service: cloudfront.amazonaws.com
          Action: s3:GetObject
          Resource:
          - Fn::Sub: arn:aws:s3:::${AWS::StackName}-iiif/working/*
          - Fn::Sub: arn:aws:s3:::${AWS::StackName}-iiif/published/*
          - Fn::Sub: arn:aws:s3:::${AWS::StackName}-iiif/av/*
          Condition:
            StringEquals:
              AWS:SourceArn:
                Fn::Sub: arn:aws:cloudfront::${AWS::AccountId}:distribution/${IIIFDistribution}
    Metadata:
      SamResourceId: IIIFBucketPolicy
  IIIFOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name:
          Fn::Sub: ${AWS::StackName}-iiif-oac
        Description: Signed reads from the IIIF bucket
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4
    Metadata:
      SamResourceId: IIIFOriginAccessControl
  IiifCorsPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name:
          Fn::Sub: ${AWS::StackName}-iiif-cors
        Comment: "IIIF is cross-origin by construction \u2014 a viewer on any host\
          \ fetches these."
        CorsConfig:
          AccessControlAllowCredentials: false
          AccessControlAllowHeaders:
            Items:
            - '*'
          AccessControlAllowMethods:
            Items:
            - GET
            - HEAD
            - OPTIONS
          AccessControlAllowOrigins:
            Items:
            - '*'
          AccessControlMaxAgeSec: 3600
          OriginOverride: true
    Metadata:
      SamResourceId: IiifCorsPolicy
  IiifWorkingHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name:
          Fn::Sub: ${AWS::StackName}-iiif-working
        Comment: 'IIIF CORS plus Cache-Control: no-cache, for the drafts a save must
          show at once.'
        CorsConfig:
          AccessControlAllowCredentials: false
          AccessControlAllowHeaders:
            Items:
            - '*'
          AccessControlAllowMethods:
            Items:
            - GET
            - HEAD
            - OPTIONS
          AccessControlAllowOrigins:
            Items:
            - '*'
          AccessControlMaxAgeSec: 3600
          OriginOverride: true
        CustomHeadersConfig:
          Items:
          - Header: Cache-Control
            Value: no-cache
            Override: true
    Metadata:
      SamResourceId: IiifWorkingHeadersPolicy
  PublicSearchOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name:
          Fn::Sub: ${AWS::StackName}-search-oac
        Description: Signed requests to the public search function
        OriginAccessControlOriginType: lambda
        SigningBehavior: always
        SigningProtocol: sigv4
    Metadata:
      SamResourceId: PublicSearchOriginAccessControl
  PublicSearchCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name:
          Fn::Sub: ${AWS::StackName}-search
        Comment: 'Public search: path plus q, from and size'
        MinTTL: 0
        DefaultTTL: 60
        MaxTTL: 86400
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: true
          EnableAcceptEncodingBrotli: true
          CookiesConfig:
            CookieBehavior: none
          HeadersConfig:
            HeaderBehavior: none
          QueryStringsConfig:
            QueryStringBehavior: whitelist
            QueryStrings:
            - q
            - from
            - size
    Metadata:
      SamResourceId: PublicSearchCachePolicy
  IIIFDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment:
          Fn::Sub: ${AWS::StackName} IIIF documents
        HttpVersion: http2and3
        IPV6Enabled: true
        Aliases:
          Fn::If:
          - HasCustomDomain
          - - Fn::Sub: iiif-${ProjectName}.${BaseDomainName}
          - Ref: AWS::NoValue
        ViewerCertificate:
          Fn::If:
          - HasCustomDomain
          - AcmCertificateArn:
              Ref: CertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true
        Origins:
        - Id: iiif-bucket
          DomainName:
            Fn::GetAtt:
            - IIIFBucket
            - RegionalDomainName
          OriginAccessControlId:
            Fn::GetAtt:
            - IIIFOriginAccessControl
            - Id
          S3OriginConfig:
            OriginAccessIdentity: ''
        - Id: public-search
          DomainName:
            Fn::Select:
            - 2
            - Fn::Split:
              - /
              - Fn::GetAtt:
                - PublicSearchFunctionUrl
                - FunctionUrl
          OriginAccessControlId:
            Fn::GetAtt:
            - PublicSearchOriginAccessControl
            - Id
          CustomOriginConfig:
            OriginProtocolPolicy: https-only
            OriginSSLProtocols:
            - TLSv1.2
        DefaultCacheBehavior:
          TargetOriginId: iiif-bucket
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
          - GET
          - HEAD
          - OPTIONS
          CachedMethods:
          - GET
          - HEAD
          - OPTIONS
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId:
            Ref: IiifCorsPolicy
        CacheBehaviors:
        - PathPattern: working/*
          TargetOriginId: iiif-bucket
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
          - GET
          - HEAD
          - OPTIONS
          CachedMethods:
          - GET
          - HEAD
          - OPTIONS
          Compress: true
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          ResponseHeadersPolicyId:
            Ref: IiifWorkingHeadersPolicy
        - PathPattern: search/*
          TargetOriginId: public-search
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
          - GET
          - HEAD
          - OPTIONS
          CachedMethods:
          - GET
          - HEAD
          Compress: true
          CachePolicyId:
            Ref: PublicSearchCachePolicy
          ResponseHeadersPolicyId:
            Ref: IiifCorsPolicy
    Metadata:
      SamResourceId: IIIFDistribution
  ImagesDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment:
          Fn::Sub: ${AWS::StackName} IIIF Image API
        HttpVersion: http2and3
        IPV6Enabled: true
        Aliases:
          Fn::If:
          - HasCustomDomain
          - - Fn::Sub: images-${ProjectName}.${BaseDomainName}
          - Ref: AWS::NoValue
        ViewerCertificate:
          Fn::If:
          - HasCustomDomain
          - AcmCertificateArn:
              Ref: CertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true
        Origins:
        - Id: iiif-lambda
          DomainName:
            Fn::GetAtt:
            - IiifServer
            - Outputs.FunctionDomain
          CustomOriginConfig:
            OriginProtocolPolicy: https-only
            OriginSSLProtocols:
            - TLSv1.2
        DefaultCacheBehavior:
          TargetOriginId: iiif-lambda
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
          - GET
          - HEAD
          - OPTIONS
          CachedMethods:
          - GET
          - HEAD
          - OPTIONS
          Compress: false
          OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
          FunctionAssociations:
          - EventType: viewer-request
            FunctionARN:
              Fn::GetAtt:
              - ImagesHostFunction
              - FunctionMetadata.FunctionARN
          CachePolicyId: b2884449-e4de-46a7-ac36-70bc7f1ddd6d
          ResponseHeadersPolicyId:
            Ref: IiifCorsPolicy
    Metadata:
      SamResourceId: ImagesDistribution
  ImagesHostFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name:
        Fn::Sub: ${AWS::StackName}-images-host
      AutoPublish: true
      FunctionConfig:
        Comment: Forward the viewer's Host as X-Forwarded-Host for serverless-iiif
        Runtime: cloudfront-js-2.0
      FunctionCode: "function handler(event) {\n  var request = event.request;\n \
        \ request.headers[\"x-forwarded-host\"] = {value: request.headers.host.value};\n\
        \  return request;\n}\n"
    Metadata:
      SamResourceId: ImagesHostFunction
  IIIFDnsRecord:
    Type: AWS::Route53::RecordSet
    Condition: ManageDns
    Properties:
      HostedZoneId:
        Ref: HostedZoneId
      Name:
        Fn::Sub: iiif-${ProjectName}.${BaseDomainName}
      Type: A
      AliasTarget:
        DNSName:
          Fn::GetAtt:
          - IIIFDistribution
          - DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false
    Metadata:
      SamResourceId: IIIFDnsRecord
  ImagesDnsRecord:
    Type: AWS::Route53::RecordSet
    Condition: ManageDns
    Properties:
      HostedZoneId:
        Ref: HostedZoneId
      Name:
        Fn::Sub: images-${ProjectName}.${BaseDomainName}
      Type: A
      AliasTarget:
        DNSName:
          Fn::GetAtt:
          - ImagesDistribution
          - DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false
    Metadata:
      SamResourceId: ImagesDnsRecord
  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName:
        Fn::Sub: ${AWS::StackName}-users
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
        InviteMessageTemplate:
          EmailSubject: Your Understory account
          EmailMessage:
            Fn::Sub:
            - You have an Understory account at ${Url}. Sign in as {username} with
              the temporary password {####}, and you will be asked to choose your
              own.
            - Url:
                Fn::If:
                - HasCustomDomain
                - Fn::Sub: https://admin-${ProjectName}.${BaseDomainName}
                - Fn::Sub: https://${AdminDistribution.DomainName}
      AutoVerifiedAttributes:
      - email
      UsernameAttributes:
      - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
    Metadata:
      SamResourceId: CognitoUserPool
  AdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      UserPoolId:
        Ref: CognitoUserPool
      GroupName: admin
      Description: Full access, including managing users and collection grants
      Precedence: 0
    Metadata:
      SamResourceId: AdminGroup
  EditorGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      UserPoolId:
        Ref: CognitoUserPool
      GroupName: editor
      Description: Full control of works inside granted collections
      Precedence: 10
    Metadata:
      SamResourceId: EditorGroup
  CognitoUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName:
        Fn::Sub: ${AWS::StackName}-web-client
      UserPoolId:
        Ref: CognitoUserPool
      GenerateSecret: false
      ExplicitAuthFlows:
      - ALLOW_USER_SRP_AUTH
      - ALLOW_REFRESH_TOKEN_AUTH
    Metadata:
      SamResourceId: CognitoUserPoolClient
  CognitoIdentityPool:
    Type: AWS::Cognito::IdentityPool
    Properties:
      IdentityPoolName:
        Fn::Sub: ${AWS::StackName}-identity
      AllowUnauthenticatedIdentities: false
      CognitoIdentityProviders:
      - ClientId:
          Ref: CognitoUserPoolClient
        ProviderName:
          Fn::GetAtt:
          - CognitoUserPool
          - ProviderName
    Metadata:
      SamResourceId: CognitoIdentityPool
  CognitoAuthenticatedRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Federated: cognito-identity.amazonaws.com
          Action: sts:AssumeRoleWithWebIdentity
          Condition:
            StringEquals:
              cognito-identity.amazonaws.com:aud:
                Ref: CognitoIdentityPool
            ForAnyValue:StringLike:
              cognito-identity.amazonaws.com:amr: authenticated
      Policies:
      - PolicyName: IIIFBucketRead
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action: s3:GetObject
            Resource:
              Fn::Sub: arn:aws:s3:::${AWS::StackName}-iiif/*
          - Effect: Allow
            Action: s3:ListBucket
            Resource:
              Fn::Sub: arn:aws:s3:::${AWS::StackName}-iiif
      - PolicyName: SourceBucketImageAccess
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - s3:GetObject
            - s3:PutObject
            - s3:AbortMultipartUpload
            Resource:
            - Fn::Sub: arn:aws:s3:::${AWS::StackName}-source/image/*
            - Fn::Sub: arn:aws:s3:::${AWS::StackName}-source/av/*
          - Effect: Allow
            Action: s3:ListBucket
            Resource:
              Fn::Sub: arn:aws:s3:::${AWS::StackName}-source
            Condition:
              StringLike:
                s3:prefix:
                - image/*
                - av/*
    Metadata:
      SamResourceId: CognitoAuthenticatedRole
  CognitoIdentityPoolRoleAttachment:
    Type: AWS::Cognito::IdentityPoolRoleAttachment
    Properties:
      IdentityPoolId:
        Ref: CognitoIdentityPool
      Roles:
        authenticated:
          Fn::GetAtt:
          - CognitoAuthenticatedRole
          - Arn
    Metadata:
      SamResourceId: CognitoIdentityPoolRoleAttachment
  SearchCollectionGroup:
    Type: AWS::OpenSearchServerless::CollectionGroup
    Properties:
      Name:
        Fn::If:
        - SearchCollectionNameProvided
        - Ref: SearchCollectionName
        - Ref: AWS::StackName
      Description:
        Fn::Sub: Published search indexes for ${AWS::StackName}
      Generation: NEXTGEN
      StandbyReplicas: ENABLED
      CapacityLimits:
        MinIndexingCapacityInOcu: 0
        MinSearchCapacityInOcu: 0
        MaxIndexingCapacityInOcu:
          Ref: SearchMaxOcu
        MaxSearchCapacityInOcu:
          Ref: SearchMaxOcu
    Metadata:
      SamResourceId: SearchCollectionGroup
  SearchEncryptionPolicy:
    Type: AWS::OpenSearchServerless::SecurityPolicy
    Properties:
      Name:
        Fn::Sub:
        - ${Name}-enc
        - Name:
            Fn::If:
            - SearchCollectionNameProvided
            - Ref: SearchCollectionName
            - Ref: AWS::StackName
      Type: encryption
      Policy:
        Fn::Sub:
        - '{"Rules":[{"ResourceType":"collection","Resource":["collection/${Name}"]}],"AWSOwnedKey":true}'
        - Name:
            Fn::If:
            - SearchCollectionNameProvided
            - Ref: SearchCollectionName
            - Ref: AWS::StackName
    Metadata:
      SamResourceId: SearchEncryptionPolicy
  SearchNetworkPolicy:
    Type: AWS::OpenSearchServerless::SecurityPolicy
    Properties:
      Name:
        Fn::Sub:
        - ${Name}-net
        - Name:
            Fn::If:
            - SearchCollectionNameProvided
            - Ref: SearchCollectionName
            - Ref: AWS::StackName
      Type: network
      Policy:
        Fn::Sub:
        - '[{"Rules":[{"ResourceType":"collection","Resource":["collection/${Name}"]}],"AllowFromPublic":true}]'
        - Name:
            Fn::If:
            - SearchCollectionNameProvided
            - Ref: SearchCollectionName
            - Ref: AWS::StackName
    Metadata:
      SamResourceId: SearchNetworkPolicy
  SearchDataAccessPolicy:
    Type: AWS::OpenSearchServerless::AccessPolicy
    Properties:
      Name:
        Fn::Sub:
        - ${Name}-data
        - Name:
            Fn::If:
            - SearchCollectionNameProvided
            - Ref: SearchCollectionName
            - Ref: AWS::StackName
      Type: data
      Policy:
        Fn::Sub:
        - '[{"Rules":[{"ResourceType":"collection","Resource":["collection/${Name}"],"Permission":["aoss:CreateCollectionItems","aoss:DeleteCollectionItems","aoss:UpdateCollectionItems","aoss:DescribeCollectionItems"]},{"ResourceType":"index","Resource":["index/${Name}/*"],"Permission":["aoss:CreateIndex","aoss:DeleteIndex","aoss:UpdateIndex","aoss:DescribeIndex","aoss:ReadDocument","aoss:WriteDocument"]}],"Principal":["${RoleArn}"]},{"Rules":[{"ResourceType":"collection","Resource":["collection/${Name}"],"Permission":["aoss:DescribeCollectionItems"]},{"ResourceType":"index","Resource":["index/${Name}/*"],"Permission":["aoss:DescribeIndex","aoss:ReadDocument"]}],"Principal":["${PublicSearchRoleArn}"]}]'
        - RoleArn:
            Fn::GetAtt:
            - ManifestFunctionRole
            - Arn
          PublicSearchRoleArn:
            Fn::GetAtt:
            - PublicSearchFunctionRole
            - Arn
          Name:
            Fn::If:
            - SearchCollectionNameProvided
            - Ref: SearchCollectionName
            - Ref: AWS::StackName
    Metadata:
      SamResourceId: SearchDataAccessPolicy
  SearchCollection:
    Type: AWS::OpenSearchServerless::Collection
    DependsOn:
    - SearchEncryptionPolicy
    - SearchNetworkPolicy
    - SearchCollectionGroup
    Properties:
      Name:
        Fn::If:
        - SearchCollectionNameProvided
        - Ref: SearchCollectionName
        - Ref: AWS::StackName
      Type: SEARCH
      CollectionGroupName:
        Fn::If:
        - SearchCollectionNameProvided
        - Ref: SearchCollectionName
        - Ref: AWS::StackName
      Description:
        Fn::Sub: Published search indexes for ${AWS::StackName}
    Metadata:
      SamResourceId: SearchCollection
  ManifestHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        Authorizers:
          CognitoAuthorizer:
            JwtConfiguration:
              issuer:
                Fn::Sub: https://cognito-idp.${AWS::Region}.amazonaws.com/${CognitoUserPool}
              audience:
              - Ref: CognitoUserPoolClient
            IdentitySource: $request.header.Authorization
      CorsConfiguration:
        AllowOrigins:
        - '*'
        AllowMethods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
        AllowHeaders:
        - Content-Type
        - Authorization
    Metadata:
      SamResourceId: ManifestHttpApi
  ManifestFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
        - aws/lambdas/manifest/index.js
        External:
        - '@aws-sdk/*'
        Minify: false
        Sourcemap: false
        Target: node22
      SamResourceId: ManifestFunction
    Properties:
      FunctionName:
        Fn::Sub: ${AWS::StackName}-manifest-api
      Environment:
        Variables:
          COGNITO_USER_POOL_ID:
            Ref: CognitoUserPool
          OPENSEARCH_ENDPOINT:
            Fn::GetAtt:
            - SearchCollection
